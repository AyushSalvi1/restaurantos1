spring:
  datasource:
    url: jdbc:h2:mem:lifeos-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: VARCHAR
  flyway:
    enabled: true
    locations: classpath:db/migration/common
    clean-disabled: false

lifeos:
  app:
    seed-data-enabled: false
  jwt:
    secret: "test-only-secret-that-is-at-least-32-bytes-long-for-hmac-sha256-signing!!"
  scheduler:
    enabled: false
  rate-limit:
    enabled: false
  # Uploads and exports must never land in the working tree during a test run: the fixtures would be
  # indistinguishable from real user data and would accumulate between runs. Each run gets its own
  # directory under the system temp location.
  storage:
    root: ${java.io.tmpdir}/lifeos-test/storage
    knowledge-dir: ${java.io.tmpdir}/lifeos-test/knowledge
    export-dir: ${java.io.tmpdir}/lifeos-test/exports

logging:
  level:
    root: WARN
    com.lifeos: INFO
    org.springframework.web: WARN
    org.flywaydb: WARN